server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend already prefixes its own routes with /api (see BackEnd/src/app.ts),
    # so the URI is forwarded unchanged — no trailing slash on proxy_pass.
    # Ảnh loài (tối đa 15 MB) và file dữ liệu (tối đa 20 MB) đi qua đây.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:4010;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_connect_timeout 90;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
